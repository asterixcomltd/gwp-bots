name: GWP Crypto — Scan
on:
  schedule:
    # v1.1.5 FIX: was on the exact round quarter-hour (:00/:15/:30/:45),
    # the most congested slot for GitHub Actions' shared cron scheduler —
    # see forex-scan.yml's v1.1.4 note. Staggered 12 minutes off the hour,
    # clear of forex (+5) and stocks (+7).
    - cron: '12-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: gwp-crypto-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node strategy.js
        working-directory: bots/crypto
        env:
          CRYPTO_TG_TOKEN: ${{ secrets.CRYPTO_TG_TOKEN }}
          CRYPTO_CHAT_ID: ${{ secrets.CRYPTO_CHAT_ID }}
      - name: Publish live signals to AxTrader Gist
        run: node ../../shared/publish-gist.js crypto
        working-directory: bots/crypto
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
      - name: Commit updated state/log files (race-safe)
        run: |
          git config user.name "gwp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bots/crypto/*.json bots/crypto/cache/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "GWP Crypto: scan update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "Push attempt $i failed (likely a race with another bot's commit) — retrying..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
